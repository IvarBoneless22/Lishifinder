<!doctype html><html lang="uk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3554"><link rel="apple-touch-icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<title>Lishi Finder</title>
<style>
body{margin:0;background:#f3f6f8;color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:28px 18px;background:linear-gradient(145deg,#0b3554,#155b7d);color:#fff}h1{margin:0;font-size:24px}
main{max-width:760px;margin:auto;padding:14px 14px 80px}.search,select{background:#fff;border:1px solid #e0e6eb;border-radius:14px}
.search{display:flex;padding:4px 10px}.search input{width:100%;border:0;outline:0;padding:13px;font-size:17px}
.modes{display:flex;gap:8px;margin:10px 0}.mode{flex:1;border:0;border-radius:12px;padding:11px;font-weight:800}.active{background:#0b3554;color:#fff}
.filters{display:flex;gap:8px}.filters select{padding:10px;flex:1}.stats{color:#71808d;font-size:12px;margin:10px 2px}
.card{background:#fff;border:1px solid #e0e6eb;border-radius:16px;padding:14px;margin:8px 0}.top{display:flex;justify-content:space-between}
.brand{font-size:11px;text-transform:uppercase;color:#71808d;font-weight:800}.model{font-size:17px;font-weight:800}.years{font-size:13px;color:#71808d;margin-top:4px}
.badge{background:#e2f1e6;color:#23683b;padding:8px 11px;border-radius:10px;font-weight:900;height:max-content}
.lishi-photo{display:block;width:100%;max-height:260px;object-fit:contain;margin-top:12px;border-radius:12px;background:#f6f8fa}
footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e0e6eb;text-align:center;padding:10px;color:#71808d;font-size:11px}
</style></head><body>
<header><h1>🔑 Lishi Finder</h1><div>Автомобіль → Lishi • Lishi → автомобілі</div></header>
<main><div class="search">🔎 <input id="q" placeholder="BMW 5 Series, Audi A4, HU66…"></div>
<div class="modes"><button class="mode active" id="auto">🚗 Авто → Lishi</button><button class="mode" id="bylishi">🔧 Lishi → Авто</button></div>
<div class="filters"><select id="brand"><option value="">Усі марки</option></select><select id="tool"><option value="">Усі Lishi</option></select></div>
<div class="stats" id="stats"></div><div id="results"></div></main><footer>Lishi Finder</footer>
<script src="data.js?v=20260814"></script><script>
const DB=window.LISHI_DATA||{},D=DB.cars||[],PH=DB.lishiPhotos||{};
const q=document.getElementById('q'),brand=document.getElementById('brand'),tool=document.getElementById('tool'),results=document.getElementById('results'),stats=document.getElementById('stats');
let mode='auto';const n=x=>String(x||'').toLowerCase().trim();
[...new Set(D.map(x=>x.brand))].sort().forEach(x=>brand.add(new Option(x,x)));
[...new Set(D.map(x=>x.lishi))].sort().forEach(x=>tool.add(new Option(x,x)));
function render(){let s=n(q.value),b=brand.value,t=tool.value,a=D.filter(x=>(!b||x.brand===b)&&(!t||x.lishi===t));
if(s){let w=s.split(/\s+/);a=a.filter(x=>w.every(k=>[x.brand,x.model,x.years,x.lishi].some(v=>n(v).includes(k))))}
stats.textContent='Знайдено: '+a.length;
results.innerHTML=a.slice(0,300).map(x=>`<div class="card"><div class="top"><div><div class="brand">${x.brand}</div><div class="model">${x.model}</div><div class="years">${x.years}</div></div><div class="badge">${x.lishi}</div></div>${PH[x.lishi]?`<img class="lishi-photo" src="${PH[x.lishi]}" alt="${x.lishi}">`:''}</div>`).join('')||'<p>Нічого не знайдено.</p>'}
[q,brand,tool].forEach(x=>x.addEventListener('input',render));render();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=4').catch(()=>{}));
</script></body></html>
